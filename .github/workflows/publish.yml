name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write   # Trusted publishing, no API token needed

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv build

      - name: Verify the package declares no dependencies
        # The weight argument is why this package exists apart from the
        # platform's own. A dependency added here reaches every author's
        # machine, so it fails the release rather than shipping quietly.
        run: |
          deps=$(uv run python -c "
          import tomllib, pathlib
          p = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(len(p['project']['dependencies']))
          ")
          if [ "$deps" != "0" ]; then
            echo "::error::pyproject declares $deps dependencies, expected 0."
            exit 1
          fi

      - name: Verify the published surface is still three names
        # Three on purpose. A fourth export is a decision, not a commit: every
        # name here is a compatibility promise for as long as this package lives.
        run: |
          names=$(uv run python -c "
          import runware_serverless
          print(','.join(sorted(runware_serverless.__all__)))
          ")
          if [ "$names" != "endpoint,imports,serve" ]; then
            echo "::error::__all__ is '$names', expected 'endpoint,imports,serve'."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runware-serverless
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # After PyPI, never before: a release announcing a version that failed to
    # upload points at nothing installable. Its own job so the publishing job
    # keeps read-only contents.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release from the changelog
        # tests/test_changelog.py has already failed the run if the tag's
        # section is missing, so this reads what that test proved is there.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(python3 scripts/changelog_section.py "${TAG#v}")
          # Idempotent, so re-running the workflow after a flake is safe: a
          # release that already exists is updated rather than failing the run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' "$notes" | gh release edit "$TAG" --notes-file -
          else
            printf '%s\n' "$notes" | gh release create "$TAG" --title "$TAG" --notes-file -
          fi
